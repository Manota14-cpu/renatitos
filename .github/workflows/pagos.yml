# Publica el servidor de pagos (carpeta pagos/) cuando cambian los productos o el servidor,
# para que Mercado Pago cobre siempre los mismos precios que muestra la página.
# Necesita los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en el repositorio; sin ellos solo corre las pruebas.
name: Servidor de pagos

on:
  push:
    branches: [main]
    paths: [productos.js, 'pagos/**']
  pull_request:
    paths: [productos.js, 'pagos/**']

jobs:
  pagos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pagos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Publicar en Cloudflare
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Sin CLOUDFLARE_API_TOKEN: no se publica. Ver pagos/README.md."
            exit 0
          fi
          npx wrangler deploy
